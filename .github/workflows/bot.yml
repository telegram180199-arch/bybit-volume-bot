name: Bybit Volume Scanner

on:
  schedule:
    - cron: '*/5 * * * *' # Jalan otomatis setiap 5 menit
  workflow_dispatch: # Tombol manual untuk testing

jobs:
  scan_volume:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run Scanner Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py

    - name: Commit state.json to prevent spam
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        if [ -f state.json ]; then
          git add state.json
          git commit -m "Update state.json [skip ci]" || echo "No changes to commit"
          git push
        else
          echo "Tidak ada koin pumping, file state.json belum perlu dibuat. Skip commit."
        fi
